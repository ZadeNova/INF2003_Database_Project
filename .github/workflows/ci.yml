name: CI

# Every push, no branch filter — the branching model isn't settled yet.
on: push

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python linters
        run: pip install ruff black

      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: black --check
        working-directory: backend
        run: black --check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No npm cache yet — there is no committed package-lock.json.

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier --check
        working-directory: frontend
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: app_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      # The gate: migrations must apply cleanly to an empty database.
      - name: alembic upgrade head
        working-directory: backend
        run: alembic upgrade head

      - name: pytest
        working-directory: backend
        run: pytest -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
