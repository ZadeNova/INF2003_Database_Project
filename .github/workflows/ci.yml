# CI stages 1 and 2 (docs/plans/ci.md): real databases, quality gates and the browser demo.
# No repository secrets: init_env.py generates throwaway credentials for each run. Never print .env or
# `docker compose config`. Every Compose call names this run's own project, because compose.yaml hard-codes
# `name: mercer`, and teardown removes only that project.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_browser_failure:
        description: Fail the browser canary to verify retained, redacted artifacts
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  databases:
    name: Django suite, migrations and pipeline tests (real PostgreSQL and MongoDB)
    # ubuntu-22.04 (kernel 6.8): from image 20261021, ubuntu-24.04 runners use kernel 7.0.0-azure, which MongoDB 9.0
    # refuses because Ubuntu reports every 7.0 kernel as 7.0.0 (SERVER-136848). See ci.md decision b.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: mercer-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MONGO_PORT: "0"
    steps:
      - name: Check the runner kernel (MongoDB 9.0 refuses 6.19 to 7.0.13)
        run: |
          kernel="$(uname -r)"
          echo "Runner kernel: $kernel"
          IFS=. read -r major minor patch _ <<< "${kernel%%-*}"
          patch="${patch%%[!0-9]*}"
          version=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))
          if [ "$version" -ge 6019000 ] && [ "$version" -le 7000013 ]; then
            echo "::error::Kernel $kernel is in 6.19-7.0.13, which MongoDB 9.0 refuses (DECISIONS foundation-m, SERVER-121912). Keep this job on ubuntu-22.04 or use a self-hosted runner (ci.md decision b); do not skip MongoDB."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate throwaway credentials
        run: |
          python3 src/tools/init_env.py
          # Mask the generated secrets in case a tool ever echoes one (names and ports stay readable).
          grep -E '^[A-Z_]*(PASSWORD|SECRET_KEY)=.' .env | cut -d= -f2- | while IFS= read -r value; do echo "::add-mask::$value"; done

      - name: Build the images
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" build migrate
          docker compose -p "$COMPOSE_PROJECT_NAME" --profile tools build tools

      - name: Start PostgreSQL and MongoDB and wait until healthy
        run: docker compose -p "$COMPOSE_PROJECT_NAME" up --detach --wait --wait-timeout 300 db mongo

      - name: Migrate as the owner role
        run: docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate

      - name: Migration drift check
        run: docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate python manage.py makemigrations --check --dry-run

      - name: Import the committed Olist fixture and seed demo accounts
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate python manage.py import_olist --source /app/tests/fixtures/olist/clean
          docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate python manage.py seed_demo

      - name: Full Django suite with line coverage gate and branch reports
        run: |
          mkdir -p coverage-reports
          chmod a+rwx coverage-reports
          docker compose -p "$COMPOSE_PROJECT_NAME" run --rm \
            --volume "$PWD/coverage-reports:/reports" migrate \
            python /app/scripts/coverage_suite.py --output /reports

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-reports/coverage.xml
            coverage-reports/htmlcov/
          retention-days: 7

      - name: Analytics pipeline tests
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --profile tools run --rm tools pytest -q -rs -p no:cacheprovider analytics/tests

      - name: Database logs on failure (no credentials are logged)
        if: failure()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" logs --no-color --tail 200 db mongo

      - name: Tear down this run's project only
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --profile tools down --volumes --remove-orphans

  host:
    name: Documentation check and host Git-index/packaging tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r src/requirements.txt

      - name: Documentation check
        run: python scripts/check_docs.py

      - name: Host Git-index and packaging tests (must not skip)
        run: |
          git --version
          python -m pytest --noconftest -q -rs -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest" \
            --junitxml "$RUNNER_TEMP/host.xml" tests/test_check_docs.py tests/test_package_submission.py
          python - "$RUNNER_TEMP/host.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot().find("testsuite")
          skipped = int(suite.get("skipped", 0))
          print(f"host tests: {suite.get('tests')} run, {skipped} skipped")
          sys.exit(1 if skipped else 0)
          PY

  quality:
    name: Python lint and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r src/requirements-dev.txt
      - name: Ruff lint (E, F, I)
        run: python -m ruff check .
      - name: Audit app, development, tools and minimal translation environments
        run: python scripts/audit_requirements.py

  benchmark:
    name: Benchmark fixture correctness (optional ruleset check)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: mercer-ci-bench-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start duration record and generate private credentials
        run: |
          echo "BENCH_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          python3 src/tools/init_env.py
          grep -E '^[A-Z_]*(PASSWORD|SECRET_KEY)=.' .env | cut -d= -f2- | while IFS= read -r value; do echo "::add-mask::$value"; done
      - name: Build and start isolated bench services
        run: |
          mkdir -p benchmarks/results
          chmod a+rwx benchmarks/results
          docker compose -p "$COMPOSE_PROJECT_NAME" --profile bench build bench-runner
          docker compose -p "$COMPOSE_PROJECT_NAME" --profile bench up --detach --wait --wait-timeout 300 bench-db bench-mongo
      - name: Load the committed fixture and run real-database benchmark tests
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" --profile bench run --rm bench-runner python -m benchmarks.load --source /app/fixtures/olist/clean
          docker compose -p "$COMPOSE_PROJECT_NAME" --profile bench run --rm bench-runner pytest -c /dev/null --rootdir=/app/benchmarks -q -p no:cacheprovider /app/benchmarks/tests
      - name: Correctness only (no accepted timing)
        run: python3 -m benchmarks.run --project "$COMPOSE_PROJECT_NAME" --source /app/fixtures/olist/clean --golden fixture --mode correctness --label ci-fixture
      - name: Record job duration
        if: always()
        run: |
          mkdir -p .cache/benchmark-ci
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          Path('.cache/benchmark-ci/duration.json').write_text(json.dumps({'duration_seconds': time.time() - int(os.environ['BENCH_JOB_START'])}))
          PY
      - name: Upload all benchmark evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/results/*/host.json
            benchmarks/results/*/provenance.json
            benchmarks/results/*/raw.jsonl*
            benchmarks/results/*/summary.csv
            benchmarks/results/*/runs.csv
            benchmarks/results/*/storage.csv
            benchmarks/results/*/stats.jsonl
            benchmarks/results/*/console.txt
            benchmarks/results/*/plans/
            benchmarks/results/*/report/
            .cache/benchmark-ci/duration.json
          include-hidden-files: true
          retention-days: 7
      - name: Tear down this benchmark project's containers and volumes only
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --profile bench down --volumes --remove-orphans

  browser:
    name: Chromium demo story (runtime web)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: mercer-browser-${{ github.run_id }}-${{ github.run_attempt }}
      APP_PORT: "8011"
      MONGO_PORT: "0"
      FORCE_BROWSER_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_browser_failure && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the runner kernel (MongoDB 9.0 refuses 6.19 to 7.0.13)
        run: |
          kernel="$(uname -r)"
          echo "Runner kernel: $kernel"
          IFS=. read -r major minor patch _ <<< "${kernel%%-*}"
          patch="${patch%%[!0-9]*}"
          version=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))
          if [ "$version" -ge 6019000 ] && [ "$version" -le 7000013 ]; then
            echo "::error::Kernel $kernel is incompatible with the pinned MongoDB; do not skip database checks."
            exit 1
          fi
      - name: Generate, mask and export only demo login secrets
        run: |
          python src/tools/init_env.py
          grep -E '^[A-Z_]*(PASSWORD|SECRET_KEY)=.' .env | cut -d= -f2- | while IFS= read -r value; do echo "::add-mask::$value"; done
          python - <<'PY'
          import os
          from pathlib import Path
          names = {"DEMO_CUSTOMER_PASSWORD", "DEMO_SELLER_PASSWORD", "DEMO_OPERATOR_PASSWORD"}
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for line in Path(".env").read_text().splitlines():
                  key, separator, value = line.partition("=")
                  if separator and key in names:
                      output.write(f"{key}={value}\n")
          PY
      - name: Build owner dev image and runtime web image
        run: docker compose -p "$COMPOSE_PROJECT_NAME" build migrate web
      - name: Start real databases and migrate as owner
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" up --detach --wait --wait-timeout 300 db mongo
          docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate
      - name: Import the fixture and seed independent demo journeys
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate python manage.py import_olist --source /app/tests/fixtures/olist/clean
          docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate python manage.py seed_demo
          docker compose -p "$COMPOSE_PROJECT_NAME" run --rm migrate python manage.py seed_activity --count 2000
      - name: Start runtime web and wait for health
        run: docker compose -p "$COMPOSE_PROJECT_NAME" up --detach --wait --wait-timeout 300 web
      - name: Install pinned browser tools and Chromium
        run: |
          python -m pip install --disable-pip-version-check -r src/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run the serial Chromium demo story
        run: |
          args=()
          if [ "$FORCE_BROWSER_FAILURE" = "true" ]; then args+=(--force-browser-failure); fi
          python -m scripts.browser_suite --base-url "http://127.0.0.1:$APP_PORT" \
            --output test-results "${args[@]}"
      - name: Sanitize retained browser artifacts
        id: browser_artifacts
        if: failure()
        run: |
          python scripts/sanitize_browser_artifacts.py test-results
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Upload browser failure traces and screenshots
        if: failure() && steps.browser_artifacts.outputs.safe == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
      - name: Service logs on failure (no credentials are logged)
        if: failure()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" logs --no-color --tail 200 db mongo web
      - name: Tear down this browser project's containers and volumes only
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
