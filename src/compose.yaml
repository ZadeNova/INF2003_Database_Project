name: mercer-foundation
x-django-environment: &django-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run tools/init_env.py first}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  POSTGRES_DB: ${POSTGRES_DB:?Run tools/init_env.py first}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
services:
  db:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run tools/init_env.py first}
      APP_DB_NAME: ${POSTGRES_DB:?Run tools/init_env.py first}
      APP_OWNER_USER: ${POSTGRES_OWNER_USER:?Run tools/init_env.py first}
      APP_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Run tools/init_env.py first}
      APP_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?Run tools/init_env.py first}
      APP_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Run tools/init_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    image: mercer-foundation-app
    environment:
      <<: *django-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:?Run tools/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Run tools/init_env.py first}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  # Runs as the owner role: migrations, and (with a different command) the importer and pytest.
  migrate:
    build: .
    image: mercer-foundation-app
    environment:
      <<: *django-environment
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?Run tools/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Run tools/init_env.py first}
      # Only the role tests use these, to prove what the runtime role may not do.
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?Run tools/init_env.py first}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Run tools/init_env.py first}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../tests:/app/tests:ro,z
      - ../data:/app/data:ro,z
    restart: "no"
volumes:
  postgres_data:
