{% extends "base.html" %}

{% block title %}Not available · Mercer{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="error-title">
    <div class="error-page__card">
        <p class="eyebrow"><span class="eyebrow__line" aria-hidden="true"></span> Not available</p>

    </div>
</section>
{% endblock %}
